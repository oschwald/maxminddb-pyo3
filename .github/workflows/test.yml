---
name: Test

on:
  push:
  pull_request:
  schedule:
    - cron: "3 15 * * SUN"

permissions:
  contents: read

jobs:
  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # master
        with:
          toolchain: stable

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Build and install extension
        run: |
          pip install maturin
          maturin build --release
          pip install --no-index --find-links target/wheels maxminddb-rust

      - name: Run tests
        run: pytest -v tests/

  test-free-threaded:
    name: Test free-threaded Python 3.14
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up free-threaded Python 3.14
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14t"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: stable

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install maturin pytest

      - name: Build and install extension
        run: |
          maturin build --release
          pip install --no-index --find-links target/wheels maxminddb-rust

      - name: Verify free-threading remains enabled
        run: >-
          python -c "import sys; import maxminddb_rust;
          assert not sys._is_gil_enabled()"

      - name: Run tests
        run: pytest -v tests/

      - name: Exercise parallel lookups
        run: >-
          python benchmarks/benchmark_parallel.py
          --file tests/data/test-data/GeoIP2-City-Test.mmdb
          --count 100000 --workers 1,2,4
